server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: zelo-monitor
  datasource:
    url: ${DB_URL:jdbc:h2:mem:zelodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        auto-startup: ${RABBITMQ_AUTO_STARTUP:true}
        missing-queues-fatal: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:chave-nao-configurada}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}

app:
  jwt:
    secret: ${JWT_SECRET:troque-por-um-segredo-bem-grande-e-aleatorio-de-pelo-menos-32-caracteres}
    expirationMs: ${JWT_EXPIRATION_MS:3600000}
  zelo:
    modo-simulacao: ${MODO_SIMULACAO:true}
    cuidado-url: ${ZELO_CUIDADO_URL:http://localhost:5000}
    insights-url: ${ZELO_INSIGHTS_URL:http://localhost:8000}
    rabbitmq:
      exchange: zelo
      queue-eventos: zelo.sensor.eventos
      queue-relogio: zelo.sensor.relogio
      routing-key-evento: sensor.evento
      routing-key-relogio: sensor.relogio
